name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pipeline_db
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        env:
          DB_NAME: pipeline_db
          DB_USER: pipeline_user
          DB_PASSWORD: pipeline_pass
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t pipeline-manager .

      - name: Confirm build success
        run: echo "Docker image built successfully"